show_eval_time_in_prompts: true
target_score: 24.0

# Numeric eval-slot budget — 0 = unlimited. Evals benchmark CPU kernels and
# are cache-friendly. See docs/problem_design_guide.md §9.
concurrency: 0

specs:
  fitness:
    description: "Geometric median time (µs) across 3 matrix sizes — lower is better. V14opt baseline: ~770 µs. NEW TARGET: 24 µs (~3% of baseline). Previous 477 µs target was already beaten — this is the real goal now."
    decimals: 2
    is_primary: true
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 100000.0
    include_in_prompts: true
    significant_change: 10.0
    sentinel_value: 100000.0
  is_valid:
    description: "Correctness — 1 if output matches reference gemmV0 on all test sizes"
    higher_is_better: true
    sentinel_value: 0
  time_small:
    description: "Time (µs) on 32x1024x16 — V14opt: 15.78, V19: 19.51"
    decimals: 2
    higher_is_better: false
    include_in_prompts: true
    sentinel_value: 100000.0
  time_medium:
    description: "Time (µs) on 64x16384x32 — V14opt: 911.64, V19: 1229.37"
    decimals: 2
    higher_is_better: false
    include_in_prompts: true
    sentinel_value: 100000.0
  time_large:
    description: "Time (µs) on 128x65536x56 — V14opt: 12422.36, V19: 14987.16"
    decimals: 2
    higher_is_better: false
    include_in_prompts: true
    sentinel_value: 100000.0
