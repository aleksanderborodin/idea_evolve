# Metrics contract. See docs/problem_design_guide.md §4 (multi-metric) and §13 (Kaggle).
# This is a skeleton — copy to problems/<id>/metrics.yaml and replace <PLACEHOLDERS>.

show_eval_time_in_prompts: true
target_score: <TARGET_SCORE>

# Numeric eval-slot budget. Every agent role (explore/exploit/full/genetic/
# research/experimentator) counts as one slot.
#   0   = unlimited (CPU-bound, or GPU+MPS). Default for most Kaggle problems.
#   1   = serial. GPU training without MPS, shared TCP port, exclusive file lock.
#   N>1 = capped parallelism (GPU+MPS with memory limits, rate-limited external API).
# Must be a non-negative integer. See §9.1.
concurrency: 0

# Per-group Light Evaluator (Phase 2.5). True = runs a surgical sonnet eval
# between parallel groups so the next group's agents see new ideas/patterns.
# Default: true — works for every concurrency value:
#   - concurrency: 0 or N>=2 → runs between multi-agent groups
#   - concurrency: 1 → runs between single-agent groups (mid-gen learning
#     is especially valuable here since serial agents would otherwise only
#     learn from each other via the end-of-gen heavy evaluator)
# Set false only if you have a specific reason (e.g. sonnet cost dominates
# an already-cheap eval). See docs/problem_design_guide.md §9.5.
# evaluator_light_enabled: true

# Set true only if entrypoint() trains a model whose checkpoint agents may want
# to reproduce without retraining. Most Kaggle problems don't need this.
archive_checkpoints: false

specs:
  fitness:
    description: "<Primary metric description, e.g. 'RMSE on the val fold' or 'sum of path lengths'>"
    decimals: <NUM_DECIMALS>
    is_primary: true
    higher_is_better: <true | false>
    lower_bound: <FLOAT>
    upper_bound: <FLOAT>
    include_in_prompts: true
    significant_change: <FLOAT>
    # For higher_is_better: true → sentinel_value: 0
    # For higher_is_better: false → sentinel_value: 1000000000  (see §13.10)
    sentinel_value: <SENTINEL>
  is_valid:
    description: "1 if entrypoint returned a valid prediction dict, 0 otherwise"
    higher_is_better: true
    sentinel_value: 0
