# =============================================================================
# Problem Metrics — Permutation Codes M(8,5)
# =============================================================================
# Maximize the size of a permutation code with length 8 and min distance 5.

show_eval_time_in_prompts: true

# Target: beat the best known lower bound of 616 (Smith & Montemanni 2012)
target_score: 624

specs:
  fitness:
    description: Code size (number of codewords/permutations)
    decimals: 0
    is_primary: true
    higher_is_better: true       # Maximize code size
    lower_bound: 1               # Minimum valid code has 1 permutation
    upper_bound: 926             # Theoretical upper bound from LP
    include_in_prompts: true
    significant_change: 1        # Any additional codeword is significant
    sentinel_value: 0            # Returned on evaluation error

  is_valid:
    description: Whether the code satisfies all constraints (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0

  min_distance:
    description: Minimum pairwise Hamming distance in the code
    decimals: 0
    is_primary: false
    higher_is_better: false      # We want exactly d=5, not higher
    lower_bound: 5
    upper_bound: 8
    include_in_prompts: true
    significant_change: 1
    sentinel_value: 0
