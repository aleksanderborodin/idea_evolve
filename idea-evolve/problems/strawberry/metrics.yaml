show_eval_time_in_prompts: true
target_score: 0.92

# Numeric eval-slot budget. Every agent role (including research and
# experimentator) counts as one slot. Strawberry trains YOLO on the single GPU
# without an MPS-safe sharing path, so exactly 1 eval runs at a time. The
# architect's group sizing is the primary defense; evaluate.py also holds the
# system-wide GPU file lock (GPU_LOCK_PATH) as a physical backstop.
# See docs/problem_design_guide.md §9.
concurrency: 1

# Per-group Light Evaluator stays enabled even with concurrency: 1 — a sonnet
# run between each serial agent lets agent N+1 read the new ideas/patterns
# extracted from agent N before starting, which is especially valuable when
# evals are serial (the heavy end-of-gen evaluator is too late for that).
# See §9.5 of the design guide. Explicit for clarity; default is true.
evaluator_light_enabled: true

# Persist best.pt under runs/<problem>/<attempt>/checkpoints/<content_hash>.pt
# so a scored solution can be reproduced without retraining via
# `evaluate.py --reproduce <hash>`. LRU pruned to checkpoint_retention.
archive_checkpoints: true
checkpoint_retention: 50

specs:
  fitness:
    description: "Mask mAP50 on the open test split (743 images) after PROXY_EPOCHS=50 training. Proxy for 100-epoch performance. Baseline ~0.84, best known ~0.87."
    decimals: 4
    is_primary: true
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.002
    sentinel_value: 0
  is_valid:
    description: "1 if config was valid and training succeeded, 0 otherwise"
    higher_is_better: true
    sentinel_value: 0
  mAP50_95:
    description: "Mask mAP50-95 on the open test split (stricter IoU average)"
    decimals: 4
    higher_is_better: true
    include_in_prompts: true
    sentinel_value: 0
  F1:
    description: "Mask F1 score on the open test split"
    decimals: 4
    higher_is_better: true
    sentinel_value: 0
