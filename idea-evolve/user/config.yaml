# =============================================================================
# Idea Evolve — Configuration
# =============================================================================

# --- Evolution parameters ---
generations: 30                    # Maximum number of generations to run
# NOTE: target_score and fitness direction are in problem/metrics.yaml (problem-specific)

# --- Agent types ---
# Each type can be enabled/disabled and limited in how many instances
# the Architect may launch per generation.
agents:
  explore:
    enabled: true
    max_instances: 3               # Broad search agents — try new approaches
  exploit:
    enabled: true
    max_instances: 3               # Refine existing top solutions
  genetic:
    enabled: true
    max_instances: 3               # Cross two parent solutions
    parents_per_instance: 2        # Always 2 parents for crossover
  full:
    enabled: true
    max_instances: 3               # End-to-end solution builders
  research:
    enabled: true
    max_instances: 3               # Domain research, no code output
  experimentator:
    enabled: true
    max_instances: 3               # Controlled experiments to answer questions

# --- Analysis phases ---
# These run after agents finish each generation.
analysis:
  evaluator:
    enabled: true
    model: sonnet                  # Heavy end-of-generation evaluator — full consolidation
  evaluator_light:
    enabled: true                  # Runs AFTER EACH parallel group (except the last) so
    model: sonnet                  # the next group's agents see new ideas/patterns immediately.
                                   # Surgical scope: only new_ideas + new_patterns + group_notes.
                                   # Skipped on single-group manifests (heavy eval is next anyway)
                                   # and on groups that produced zero solutions.
  system_critic:
    enabled: true
    model: sonnet                  # Critic is lighter-weight analysis
  consistency_reviewer:
    model: sonnet                  # Audit/rewrite state-of-affairs; keep on sonnet with architect on opus

# --- Timeouts (seconds) ---
# Three-phase timeout: work → wrap-up → debrief recovery.
# Phase 1 (work): agent runs normally with its timeout.
# Phase 2 (wrap-up): if work timed out, a new session (same model) continues
#   the actual work — finishing solutions, running evaluations, producing results.
# Phase 3 (debrief): if wrap-up also failed and no report.md exists, a lightweight
#   sonnet session writes a report capturing what was produced.
#
# The Architect can override agent_default per agent via manifest.yaml timeout field.
timeouts:
  architect: 1800                  # Architect planning session
  architect_wrapup: 600            # Architect wrap-up if planning session timed out
  agent_default: 2700              # Default work phase for solution agents
  evaluator: 2700                  # Heavy evaluator (end of generation)
  evaluator_light: 900             # Light evaluator (per-group, runs between groups)
  system_critic: 1800              # System critic analysis phase
  consistency_reviewer: 2700       # Consistency review phase
  wrap_up: 2700                    # Wrap-up session (continue work after timeout)
  debrief_recovery: 900            # Debrief recovery (report only, after wrap-up fails)

# --- Turn budgets ---
# How many tool-call turns each agent type gets. Higher = more iterations
# but more context pressure and cost. The Architect cannot override these.
max_turns:
  architect: 600                   # Planning only
  wrap_up: 1500                    # Wrap-up session to finish the work
  debrief_recovery: 150            # Debrief recovery (report writing only)
  explore: 1500                    # Timeout is the real limit, not turns
  exploit: 1500
  full: 1500
  genetic: 1500
  experimentator: 1500
  research: 1500
  evaluator: 1500
  evaluator_light: 400             # Per-group light evaluator (small scope, short turn budget)
  system_critic: 600
  consistency_reviewer: 1500

# --- Models ---
# Tier aliases are routed by harnesses.per_model below:
# opus → codex/gpt-5.5 with high reasoning effort, sonnet → opencode/zai/glm-5.1.
# Only the architect runs on opus by default; everything else stays on sonnet to control cost.
default_model: sonnet              # Default for solution agents (explore/exploit/full/genetic/research)
architect_model: opus              # Architect plans the generation — high-reasoning role
experimentator_model: sonnet       # Experimentator stays on sonnet per current policy

# --- Parallelism ---
max_parallel_sessions: 10          # Max concurrent agent harness sessions

# --- Agent harnesses (which CLI launches each agent session) ---
# default: claude-code | opencode | codex
# per_agent: optional overrides by agent role (architect, explore, exploit, full, genetic,
#   experimentator, evaluator, system_critic, consistency_reviewer).
# Unknown harness names fall back to claude-code with a warning.
harnesses:
  default: opencode
  per_agent: {}                    # role-specific overrides, if needed
  per_model:
    opus: codex                    # high-reasoning tier uses Codex

# Per-harness model aliases. Keys `opus|sonnet|haiku` map to provider/model strings.
# Opencode reads from `~/.config/opencode/opencode.json` providers; ModelGate preferred.
# Codex reads auth/config from your normal Codex CLI setup.
models:
  opencode:
    opus:   zai/glm-5.1               # all tiers → GLM-5.1 via Z.ai coding plan
    sonnet: zai/glm-5.1
    haiku:  zai/glm-5.1
  codex:
    opus:   gpt-5.5
    sonnet: gpt-5.4
    haiku:  gpt-5.4-mini
  codex_reasoning_effort:
    opus:   high

# --- Knowledge management (advisory — passed to agents as guidance, not enforced) ---
knowledge_hierarchy:
  state_of_affairs_max_tokens: 1500   # Layer 0 should be concise
  cluster_max_tokens: 400             # Each cluster summary
  max_clusters: 20                    # Limit to prevent sprawl
  merge_threshold: 0.7                # Similarity threshold for cluster merging

# --- Idea lifecycle (advisory — evaluator sees these as guidance text) ---
idea_limits:
  max_ideas: 100                   # Soft cap on total ideas
  threshold_30: good               # Under 30: add if good
  threshold_50: very_good          # 30-50: add only if very good
  threshold_100: revolutionary     # 50-100: add only if revolutionary

staleness_threshold: 5             # Generations without confirmation before flagging stale

# --- Consistency review ---
consistency_review_interval: 1     # Run consistency review every N generations
emergency_review_on_strategic_shift: true  # Also run on evaluator strategic_shift flag
